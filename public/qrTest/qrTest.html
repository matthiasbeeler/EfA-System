<!-- HTML file with a video element and a canvas element -->
<video id="video" width="640" height="480" autoplay></video>
<canvas id="canvas" width="640" height="480"></canvas>

<!-- JavaScript code to access the user's camera and scan for QR codes -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@latest/umd/index.min.js"></script>
<script>
  // Set up the QR code reader
  const codeReader = new ZXing.BrowserQRCodeReader();

  // Set up the video stream
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function(stream) {
      video.srcObject = stream;
    });

  // Set up a loop to continuously scan for QR codes
  function scan() {
    // Set up a timeout to stop scanning after a certain period of time
    // (e.g. 5 seconds) to prevent the scanner from running indefinitely
    setTimeout(function() {
      scanning = false;
    }, 5000);

    // Draw the video frame to the canvas
    canvas.getContext('2d').drawImage(video, 0, 0);

    // Scan the image for QR codes
    codeReader.decodeFromImage(canvas)
      .then(result => {
        console.log(result.text);
        alert(result.text)
      })
      .catch(err => {
        console.error(err);
      });

    // Continue scanning
    if (scanning) {
      requestAnimationFrame(scan);
    }
  }

  // Start scanning
  var scanning = true;
  scan();
</script>
