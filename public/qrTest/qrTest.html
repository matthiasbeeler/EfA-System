<!-- HTML file with a video element -->
<video id="video" width="640" height="480" autoplay></video>

<!-- JavaScript code to access the user's camera and scan for QR codes -->
<script src="/qrTest/js.js"></script>
<script>
  // Set up the QR code reader
  Quagga.init({
    inputStream: {
      type: 'LiveStream',
      target: document.querySelector('#video'),
      constraints: {
        width: 640,
        height: 480,
        facingMode: 'environment',
      },
    },
    locator: {
      patchSize: 'medium',
      halfSample: true,
    },
    decoder: {
      readers: ['qr_reader'],
    },
    locate: true,
  }, function(err) {
    if (err) {
      console.log(err);
      return
    }
    console.log('Initialization finished. Ready to start');
    Quagga.start();
  });

  // Handle QR code detection
  Quagga.onDetected(function(result) {
    console.log(result.codeResult.code);
  });
</script>
